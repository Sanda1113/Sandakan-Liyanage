<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2630"/>
      <stop offset="1" stop-color="#0d1419"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6c66e"/>
      <stop offset="1" stop-color="#e9a63c"/>
    </linearGradient>
  </defs>
  <!-- Tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#e9a63c" stroke-opacity="0.35" stroke-width="2"/>
  <!-- S: two stacked arcs drawn as a single stroke -->
  <path d="M38 19.5 A8.5 8.5 0 0 0 21 19.5 A8.5 8.5 0 0 0 29.5 28 H31 A8.5 8.5 0 0 1 39.5 36.5 A8.5 8.5 0 0 1 22 36.5"
        fill="none" stroke="url(#amber)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- L: shares the baseline, offset right -->
  <path d="M46 14 V48 H56" fill="none" stroke="#e7edf2" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Status dot, echoing the console card -->
  <circle cx="14" cy="50" r="3.2" fill="#34d399"/>
</svg>
